spring:
  config:
    # Local overrides and real credentials belong in this ignored file.
    import: optional:file:./tmp/application-local.yml

ruyi:
  upload-path: ${RUYI_UPLOAD_PATH:./files/}
  # 数据库备份目录，必须与 upload-path 分离：upload-path 由 /profile/** 匿名对外提供
  backup-path: ${RUYI_BACKUP_PATH:./backups/}

knife4j:
  enable: ${KNIFE4J_ENABLED:true}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

auth:
  token:
    # This known fallback is only for the dev profile; production requires a private value.
    secret: ${AUTH_TOKEN_SECRET:__local-development-only__}

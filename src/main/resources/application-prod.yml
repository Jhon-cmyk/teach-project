server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

spring:
  devtools:
    add-properties: false
    restart:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

ruyi:
  upload-path: ${RUYI_UPLOAD_PATH}
  # 必须与 upload-path 分离，否则数据库备份会经 /profile/** 被未登录用户下载
  backup-path: ${RUYI_BACKUP_PATH:./backups/}

# 生产默认走 Judge0 沙箱；LocalCodeExecutor 无隔离，不允许成为生产缺省值。
code-executor:
  mode: ${CODE_EXECUTOR_MODE:judge0}

knife4j:
  enable: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

auth:
  token:
    # Production must provide a private, stable secret so tokens survive service restarts.
    secret: ${AUTH_TOKEN_SECRET}

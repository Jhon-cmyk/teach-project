name: teach-platform

services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_NAME:-teach_platform}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-teach}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-change-me}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${DOCKER_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "${DOCKER_QDRANT_HTTP_PORT:-6333}:6333"
      - "${DOCKER_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ai-server:
    build:
      context: ./teach-ai-server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AI_SERVER_ENV: prod
      AI_SERVER_HOST: 0.0.0.0
      AI_SERVER_PORT: 5000
      AI_SERVER_DEBUG: "false"
      AI_SERVER_CORS_ALLOWED_ORIGINS: http://localhost:${DOCKER_FRONTEND_PORT:-8080}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-teach_prepare_docs}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
    ports:
      - "${DOCKER_AI_PORT:-5000}:5000"
    volumes:
      - ai_videos:/app/static/videos
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8820
      DB_URL: jdbc:mysql://mysql:3306/${DOCKER_DB_NAME:-teach_platform}?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${DOCKER_DB_USERNAME:-teach}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-change-me}
      FLYWAY_ENABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      RUYI_UPLOAD_PATH: /app/files/
      APP_CORS_ALLOWED_ORIGINS: http://localhost:${DOCKER_FRONTEND_PORT:-8080}
      SESSION_COOKIE_SECURE: ${DOCKER_SESSION_COOKIE_SECURE:-false}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-30d}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30d}
      SESSION_COOKIE_MAX_AGE: ${SESSION_COOKIE_MAX_AGE:-30d}
      AI_AGENT_BASE_URL: http://ai-server:5000
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      JUDGE0_BASE_URL: ${DOCKER_JUDGE0_BASE_URL:-http://host.docker.internal:2358}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
      CODE_EXECUTOR_MODE: ${CODE_EXECUTOR_MODE:-judge0}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/chat/completions}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      XFYUN_AVATAR_ENABLED: ${XFYUN_AVATAR_ENABLED:-false}
      XFYUN_AVATAR_SERVER_URL: ${XFYUN_AVATAR_SERVER_URL:-wss://avatar.cn-huadong-1.xf-yun.com/v1/interact}
      XFYUN_AVATAR_APP_ID: ${XFYUN_AVATAR_APP_ID:-}
      XFYUN_AVATAR_API_KEY: ${XFYUN_AVATAR_API_KEY:-}
      XFYUN_AVATAR_API_SECRET: ${XFYUN_AVATAR_API_SECRET:-}
      XFYUN_AVATAR_SCENE_ID: ${XFYUN_AVATAR_SCENE_ID:-}
      XFYUN_AVATAR_ID: ${XFYUN_AVATAR_ID:-}
      XFYUN_AVATAR_NAME: ${XFYUN_AVATAR_NAME:-朵朵}
      XFYUN_AVATAR_VOICE: ${XFYUN_AVATAR_VOICE:-x4_lingxiaoqi_oral}
      XFYUN_KNOWLEDGE_ENABLED: ${XFYUN_KNOWLEDGE_ENABLED:-false}
      XFYUN_KNOWLEDGE_BASE_URL: ${XFYUN_KNOWLEDGE_BASE_URL:-https://chatdoc.xfyun.cn}
      XFYUN_KNOWLEDGE_APP_ID: ${XFYUN_KNOWLEDGE_APP_ID:-}
      XFYUN_KNOWLEDGE_SECRET: ${XFYUN_KNOWLEDGE_SECRET:-}
      XFYUN_KNOWLEDGE_TOP_N: ${XFYUN_KNOWLEDGE_TOP_N:-5}
      XFYUN_KNOWLEDGE_ES_TOP_N: ${XFYUN_KNOWLEDGE_ES_TOP_N:-5}
      XFYUN_KNOWLEDGE_MIN_SCORE: ${XFYUN_KNOWLEDGE_MIN_SCORE:-45}
      AI_VISION_PROVIDER: ${AI_VISION_PROVIDER:-openai-compatible}
      AI_VISION_BASE_URL: ${AI_VISION_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      AI_VISION_API_KEY: ${AI_VISION_API_KEY:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen-vl-plus}
      ALIYUN_ASR_APP_KEY: ${ALIYUN_ASR_APP_KEY:-}
      ALIYUN_ASR_ACCESS_KEY_ID: ${ALIYUN_ASR_ACCESS_KEY_ID:-}
      ALIYUN_ASR_ACCESS_KEY_SECRET: ${ALIYUN_ASR_ACCESS_KEY_SECRET:-}
      ALIYUN_TTS_APP_KEY: ${ALIYUN_TTS_APP_KEY:-}
      ALIYUN_TTS_ACCESS_KEY_ID: ${ALIYUN_TTS_ACCESS_KEY_ID:-}
      ALIYUN_TTS_ACCESS_KEY_SECRET: ${ALIYUN_TTS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-oss-cn-shanghai.aliyuncs.com}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME:-ruyi-teach-assets}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${DOCKER_BACKEND_PORT:-8820}:8820"
    volumes:
      - backend_files:/app/files
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ai-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8820/api/actuator/health
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  frontend:
    build:
      context: ./teach-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_FACE_DETECT_API: /face/detect
    restart: unless-stopped
    ports:
      - "${DOCKER_FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      ai-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/healthz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mysql_data:
  qdrant_data:
  backend_files:
  ai_videos:

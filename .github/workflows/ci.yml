name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw --batch-mode --no-transfer-progress test

  web:
    name: Web type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: teach-frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: teach-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check and production build
        run: npm run build

  mobile:
    name: Mobile build and boundary check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: teach-mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: teach-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check and production build
        run: npm run build

      - name: Check mobile isolation boundary
        run: npm run check:boundary

  python:
    name: Python tests and Agent evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: teach-ai-server
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            teach-ai-server/requirements-test.txt
            teach-ai-server/requirements.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Compile Python sources
        run: python -m compileall -q agent evaluation tests

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run fixed Agent evaluation
        run: python -m evaluation.runner --check

  configuration:
    name: Configuration and credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Scan for literal credentials
        shell: pwsh
        run: ./scripts/check-secrets.ps1

  ci-result:
    name: CI result
    if: always()
    needs:
      - backend
      - web
      - mobile
      - python
      - configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every core check to pass
        shell: bash
        run: |
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.web.result }}" = "success"
          test "${{ needs.mobile.result }}" = "success"
          test "${{ needs.python.result }}" = "success"
          test "${{ needs.configuration.result }}" = "success"
